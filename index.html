<!doctype html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FitTrainer - Entrenador Personal Android</title>
    <meta name="description" content="App de entrenamiento personalizado para Android con catálogo de más de 40 ejercicios a repeticiones o por tiempo, temporizador circular interactivo, audio y rutinas a medida." />
    <meta property="og:title" content="FitTrainer - Entrenador Personal Android" />
    <meta property="og:description" content="App de entrenamiento personalizado para Android con catálogo de más de 40 ejercicios a repeticiones o por tiempo, temporizador circular interactivo, audio y rutinas a medida." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root" class="h-full flex flex-col">
      <!-- Fallback Splash Screen (replaced as soon as React mounts) -->
      <div id="app-splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100%;background:#020617;color:#f8fafc;font-family:'Plus Jakarta Sans',sans-serif;text-align:center;padding:1.5rem;box-sizing:border-box;">
        <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#10b981,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(16,185,129,0.4);margin-bottom:1.25rem;">
          <svg style="width:36px;height:36px;color:#020617;fill:currentColor;" viewBox="0 0 24 24"><path d="M6.5 6.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm11 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM2 13h4v4H2v-4zm16 0h4v4h-4v-4zM5 14.5v1h14v-1H5z"/></svg>
        </div>
        <h1 style="font-size:1.5rem;font-weight:900;letter-spacing:-0.03em;margin:0 0 0.25rem 0;color:#fff;">FitTrainer</h1>
        <p style="font-size:0.85rem;color:#94a3b8;margin:0 0 1.5rem 0;font-weight:600;">Tu entrenamiento personal listo</p>
        <div style="width:36px;height:36px;border:3px solid rgba(16,185,129,0.2);border-top-color:#10b981;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
        
        <!-- Auto-recovery helper if phone was offline/sleeping for hours -->
        <div id="splash-delayed" style="display:none;margin-top:2rem;max-width:280px;background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:1rem;">
          <p style="font-size:0.8rem;color:#cbd5e1;margin:0 0 0.75rem 0;">¿Iniciando sin conexión o tras varias horas?</p>
          <button onclick="window.location.reload()" style="width:100%;background:#10b981;color:#020617;font-weight:800;border:none;border-radius:10px;padding:0.6rem;font-size:0.8rem;cursor:pointer;margin-bottom:0.5rem;">
            ⚡ Reintentar Apertura
          </button>
        </div>
        <script>
          setTimeout(function() {
            var el = document.getElementById('splash-delayed');
            if (el && document.getElementById('app-splash')) el.style.display = 'block';
          }, 3500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="#020617" />
  
  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#grad)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Inner glowing gradient circle -->
  <circle cx="256" cy="256" r="180" fill="#090d16" stroke="url(#grad)" stroke-width="12" filter="url(#shadow)" />

  <!-- Dumbbell & Stopwatch geometry -->
  <!-- Top stopwatch button -->
  <rect x="236" y="46" width="40" height="26" rx="8" fill="url(#grad)" />
  <rect x="246" y="70" width="20" height="18" fill="url(#grad)" />

  <!-- Dumbbell Icon centered -->
  <g transform="translate(136, 136) scale(0.94)" stroke="url(#grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bar -->
    <line x1="80" y1="176" x2="176" y2="80" />
    <!-- Weight left -->
    <rect x="42" y="174" width="40" height="40" rx="8" transform="rotate(-45 62 194)" fill="#10b981" stroke="#10b981" stroke-width="4" />
    <rect x="22" y="194" width="40" height="40" rx="8" transform="rotate(-45 42 214)" fill="#06b6d4" stroke="#06b6d4" stroke-width="4" />
    <!-- Weight right -->
    <rect x="174" y="42" width="40" height="40" rx="8" transform="rotate(-45 194 62)" fill="#10b981" stroke="#10b981" stroke-width="4" />
    <rect x="194" y="22" width="40" height="40" rx="8" transform="rotate(-45 214 42)" fill="#06b6d4" stroke="#06b6d4" stroke-width="4" />
  </g>

  <!-- Circular progress accent arcs -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-dasharray="180 300" transform="rotate(-60 256 256)" />
</svg>
